name: PC native build
on:
  push:
    branches: [pc-app]
  pull_request:
  workflow_dispatch:
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirement.txt
      - name: Linux runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0 libusb-1.0-0 xvfb
      - name: Set up dependencies
        run: python scripts/manage.py setup --current-env
      - name: Doctor
        run: python scripts/manage.py doctor --current-env
      - name: Regression checks
        run: python scripts/manage.py test --current-env
      - name: Source GUI (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python scripts/manage.py run --current-env -- --smoke-test
      - name: Source GUI (Windows)
        if: runner.os == 'Windows'
        run: python scripts/manage.py run --current-env -- --smoke-test
      - name: Build native executables
        run: python scripts/manage.py build --current-env
      - name: Install and verify after cleaning (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          export XDG_DATA_HOME="$RUNNER_TEMP/tos data 数据"
          python scripts/manage.py install --current-env
          python scripts/manage.py clean --current-env
          "$XDG_DATA_HOME/tos-pc/platform-tools/tdb" --version
          xvfb-run -a "$XDG_DATA_HOME/tos-pc/TOS Helper" --smoke-test
          test -f "$XDG_DATA_HOME/applications/tos-helper.desktop"
      - name: Install and verify after cleaning (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'tos data 数据'
          python scripts/manage.py install --current-env --install-dir "$target"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/manage.py clean --current-env
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$target\platform-tools\tdb.exe" --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$target\TOS Helper.exe" --smoke-test
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        with:
          name: tos-pc-${{ runner.os }}
          path: dist/
          include-hidden-files: true
